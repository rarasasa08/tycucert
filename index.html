<style>
  :root{
    --bg:#f6f1f4; --card:#fff; --ink:#2b2228; --muted:#7a6d74; --line:#e4d9df;
    --brand:#b5306f; --brand-soft:#fbe8f1; --ok:#1f7a4d; --ok-soft:#e5f5ec;
    --warn:#9a5b00; --warn-soft:#fdf1dc; --bad:#b42318; --bad-soft:#fde8e6;
  }
  *{box-sizing:border-box}
  html{background:var(--bg);min-height:100%}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font:18px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
  header{background:var(--brand);color:#fff;border-radius:14px 14px 0 0;padding:20px 20px 16px}
  header h1{margin:0;font-size:22px;line-height:1.35;font-weight:700}
  .desc{background:var(--card);border-radius:0 0 14px 14px;padding:14px 20px 18px;white-space:pre-line;
    color:var(--muted);font-size:16px;border:1px solid var(--line);border-top:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:14px}
  label.q{display:block;font-weight:700;margin-bottom:8px}
  label.q .req{color:var(--bad);margin-left:4px}
  .hint{font-size:15px;color:var(--muted);margin:-4px 0 10px}
  input[type=text],input[type=tel],textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  textarea{min-height:80px;resize:vertical}
  .days{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .days button{font:inherit;font-size:16px;border:1.5px solid var(--line);background:#fff;border-radius:999px;
    padding:4px 12px;cursor:pointer;color:var(--ink)}
  .days button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .combo{position:relative}
  .list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1.5px solid var(--line);
    border-radius:10px;max-height:340px;overflow:auto;z-index:10;box-shadow:0 10px 30px rgba(60,20,40,.12);display:none}
  .list.open{display:block}
  .opt{padding:10px 14px;border-bottom:1px solid #f1eaee;cursor:pointer}
  .opt:last-child{border-bottom:0}
  .opt.active,.opt:hover{background:var(--brand-soft)}
  .opt .n{font-weight:700}
  .opt .m{font-size:14px;color:var(--muted)}
  .opt.dis{opacity:.5;cursor:not-allowed}
  .opt.dis .n::after{content:"（認證班，不需申請）";font-weight:400;font-size:14px;color:var(--bad)}
  .empty{padding:12px 14px;color:var(--muted)}
  mark{background:#ffe27a;color:inherit;border-radius:2px}
  .picked{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .chip{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);border-radius:10px;padding:10px 12px}
  .chip .t{flex:1}
  .chip .n{font-weight:700}
  .chip .m{font-size:14px;color:var(--muted)}
  .chip button{font:inherit;border:0;background:transparent;color:var(--brand);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
  .submit{display:block;width:100%;margin-top:18px;font:inherit;font-weight:700;font-size:19px;padding:14px;border:0;
    border-radius:12px;background:var(--brand);color:#fff;cursor:pointer}
  .submit:disabled{opacity:.55;cursor:wait}
  .err{color:var(--bad);font-size:15px;margin-top:6px;min-height:1em}
  .result{margin-top:14px}
  .r{border-radius:10px;padding:12px 14px;margin-top:8px}
  .r .n{font-weight:700}
  .r.ok{background:var(--ok-soft);color:var(--ok)}
  .r.warn{background:var(--warn-soft);color:var(--warn)}
  .r.bad{background:var(--bad-soft);color:var(--bad)}
  .r .msg{color:var(--ink);font-size:16px}
  .mine{display:flex;flex-direction:column;gap:8px}
  .mc{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:#fff}
  .mc input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--brand);flex:none}
  .mc.on{border-color:var(--brand);background:var(--brand-soft)}
  .mc.off{opacity:.55;cursor:not-allowed}
  .mc .n{font-weight:700}
  .mc .m{font-size:14px;color:var(--muted)}
  .mc .tag{display:inline-block;font-size:13px;font-weight:400;color:var(--bad);margin-left:6px}
  .note{background:#f7f2f5;border-radius:10px;padding:12px 14px;color:var(--muted);font-size:16px}
  .note.bad{background:var(--warn-soft);color:var(--warn)}
  .link{display:inline-block;margin-top:12px;background:none;border:0;padding:0;font:inherit;font-size:16px;color:var(--brand);text-decoration:underline;cursor:pointer}
  .closed{text-align:center;padding:40px 20px;color:var(--muted)}
  .loading{text-align:center;padding:60px 0;color:var(--muted)}
  .again{display:block;width:100%;margin-top:14px;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--brand);
    background:#fff;color:var(--brand);font-weight:700;cursor:pointer}
</style>
</head>

<script>
/* ═══════ 設定：把 Apps Script 部署後的網址（結尾是 /exec）貼在下面的引號裡 ═══════ */
var API_URL = 'https://script.google.com/macros/s/AKfycbzHARnuxwgX29KgHtaHomtpdhXvXg0oqnBrRfIrAsvFlycy8HgfucVKTZJiPIrkkZOR/exec';
/* ═══════════════════════════════════════════════════════════════════════ */

function api(action, payload){
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL)) return Promise.reject(new Error('網頁還沒設定好（API_URL），請聯絡教務處'));
  return fetch(API_URL, {method:'POST', body: JSON.stringify({action:action, payload:payload||null})})
    .then(function(r){ if(!r.ok) throw new Error('連線失敗（'+r.status+'），請稍後再試'); return r.json(); })
    .then(function(j){ if(!j || !j.ok) throw new Error((j && j.error) || '發生錯誤，請稍後再試'); return j.data; },
          function(e){ throw (e && /連線失敗/.test(e.message)) ? e : new Error('網路連線失敗，請檢查網路後再試一次'); });
}

var DATA = null, picked = [], dayFilter = '', activeIdx = -1, shown = [];
var DAYS = ['一','二','三','四','五','六','日'];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function init(){
  api('formData').then(function(d){ DATA = d; if(d.title) document.title = d.title; render(); })
    .catch(function(e){ document.getElementById('app').innerHTML='<div class="closed">載入失敗：'+esc(e.message)+'</div>'; });
}

function render(){
  var app = document.getElementById('app');
  var head = '<header><h1>'+esc(DATA.title||'學習證明申請')+'</h1></header>'+
             (DATA.desc?'<div class="desc">'+esc(DATA.desc)+'</div>':'');
  if(!DATA.open){ app.innerHTML = head+'<div class="card closed">目前未開放申請，謝謝！</div>'; return; }
  app.innerHTML = head +
  '<form id="f" autocomplete="off" onsubmit="return send(event)">'+
  '<div class="card"><label class="q" for="name">申請人姓名<span class="req">*</span></label>'+
    '<div class="hint"><b style="color:var(--bad)">請填寫報名時的完整全名</b>（不要只填姓氏、暱稱或英文名），系統會用全名確認您有上這門課。</div>'+
    '<input type="text" id="name" name="name" required maxlength="20" autocomplete="off" placeholder="例：王小明"></div>'+
  '<div class="card"><label class="q" for="phone">手機<span class="req">*</span></label>'+
    '<div class="hint">方便我們聯絡您；和報名時留的不同也沒關係</div>'+
    '<input type="tel" id="phone" name="phone" required inputmode="numeric" maxlength="15" autocomplete="off" placeholder="09xxxxxxxx"></div>'+
  '<div class="card"><label class="q">課程<span class="req">*</span></label>'+
    '<div id="searchWrap"><div class="hint">可打課程名稱、課程編號、老師、地點來搜尋；也可以先點上課星期縮小範圍。</div>'+
    '<div class="days" id="days">'+DAYS.map(function(d){return '<button type="button" data-d="'+d+'">星期'+d+'</button>';}).join('')+'</div>'+
    '<div class="combo"><input type="text" id="q" placeholder="🔍 搜尋課程…" autocomplete="off" role="combobox" aria-expanded="false">'+
    '<div class="list" id="list" role="listbox"></div></div></div>'+
    '<div class="picked" id="picked"></div></div>'+
  '<div class="card"><label class="q" for="note">備註</label>'+
    '<div class="hint">有相關問題可以留言詢問</div>'+
    '<textarea id="note" maxlength="300"></textarea></div>'+
  '<div class="err" id="err"></div>'+
  '<button class="submit" id="btn">送出申請</button></form>'+
  '<div class="result" id="result"></div>';

  var q = document.getElementById('q'), list = document.getElementById('list');
  q.addEventListener('input', function(){ openList(); });
  q.addEventListener('focus', function(){ openList(); });
  q.addEventListener('keydown', function(e){
    if(e.key==='ArrowDown'){ e.preventDefault(); move(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); move(-1); }
    else if(e.key==='Enter'){ e.preventDefault(); if(activeIdx>=0) pick(shown[activeIdx]); }
    else if(e.key==='Escape'){ closeList(); }
  });
  document.addEventListener('click', function(e){ if(!e.target.closest('.combo') && !e.target.closest('#days')) closeList(); });
  document.getElementById('days').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    dayFilter = dayFilter===b.dataset.d ? '' : b.dataset.d;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x.dataset.d===dayFilter); });
    q.focus(); openList();
  });
  list.addEventListener('mousedown', function(e){
    var o = e.target.closest('.opt'); if(!o) return; e.preventDefault();
    pick(shown[+o.dataset.i]);
  });
}

function hay(c){ return [c.name,c.teacher,c.time,c.center,c.place,c.code].join(' ').toLowerCase(); }

function filter(text){
  var toks = text.toLowerCase().replace(/週|禮拜/g,'星期').split(/\s+/).filter(Boolean);
  return DATA.courses.filter(function(c){
    if(dayFilter && (c.time||'').indexOf('星期'+dayFilter)<0) return false;
    var h = hay(c);
    return toks.every(function(t){ return h.indexOf(t)>=0; });
  });
}

function hl(s, text){
  s = esc(s);
  text.split(/\s+/).filter(Boolean).forEach(function(t){
    var i = s.toLowerCase().indexOf(esc(t).toLowerCase());
    if(i>=0) s = s.slice(0,i)+'<mark>'+s.slice(i,i+t.length)+'</mark>'+s.slice(i+t.length);
  });
  return s;
}

function openList(){
  var q = document.getElementById('q'), list = document.getElementById('list');
  var text = q.value.trim();
  shown = filter(text).filter(function(c){ return !picked.some(function(p){return p.code===c.code;}); }).slice(0,80);
  activeIdx = -1;
  list.innerHTML = shown.length ? shown.map(function(c,i){
    return '<div class="opt'+(c.cert?' dis':'')+'" data-i="'+i+'" role="option">'+
      '<div class="n">'+hl(c.name,text)+'</div>'+
      '<div class="m">'+hl([c.code,c.time,c.place||c.center,c.teacher?c.teacher+' 老師':''].filter(Boolean).join('｜'),text)+'</div></div>';
  }).join('') : '<div class="empty">找不到符合的課程，換個關鍵字試試</div>';
  list.classList.add('open'); q.setAttribute('aria-expanded','true');
}
function closeList(){ var l=document.getElementById('list'); if(l){ l.classList.remove('open'); document.getElementById('q').setAttribute('aria-expanded','false'); } }
function move(d){
  var opts = document.querySelectorAll('#list .opt'); if(!opts.length) return;
  activeIdx = (activeIdx + d + opts.length) % opts.length;
  [].forEach.call(opts, function(o,i){ o.classList.toggle('active', i===activeIdx); });
  opts[activeIdx].scrollIntoView({block:'nearest'});
}
function pick(c){
  if(!c || c.cert) return;
  picked.push(c); drawPicked();
  var q = document.getElementById('q'); q.value=''; closeList();
  document.getElementById('err').textContent='';
}
function unpick(i){ picked.splice(i,1); drawPicked(); }
function drawPicked(){
  document.getElementById('picked').innerHTML = picked.map(function(c,i){
    return '<div class="chip"><div class="t"><div class="n">'+esc(c.name)+'</div>'+
      '<div class="m">'+esc([c.code,c.time,c.place||c.center,c.teacher?c.teacher+' 老師':''].filter(Boolean).join('｜'))+'</div></div>'+
      '<button type="button" aria-label="移除" onclick="unpick('+i+')">×</button></div>';
  }).join('');
  document.getElementById('q').placeholder = picked.length ? '🔍 還有其他課程？繼續搜尋…' : '🔍 搜尋課程…';
}

function send(e){
  e.preventDefault();
  var err = document.getElementById('err');
  var name = document.getElementById('name').value.trim();
  var phone = document.getElementById('phone').value.trim();
  if(!name){ err.textContent='請填寫姓名'; return false; }
  if(name.replace(/\s/g,'').length<2 || /(先生|小姐|太太|女士|老師|阿姨|伯伯)$/.test(name)){ err.textContent='請填寫完整全名，例如「王小明」'; document.getElementById('name').focus(); return false; }
  if(phone.replace(/\D/g,'').length<9){ err.textContent='請填寫正確的手機號碼'; return false; }
  if(!picked.length){ err.textContent='請至少選擇一門課程'; return false; }
  err.textContent='';
  var btn = document.getElementById('btn'); btn.disabled=true; btn.textContent='送出中…';
  api('submit', {name:name, phone:phone, courses:picked.map(function(c){return c.code;}), note:document.getElementById('note').value})
    .then(function(res){ btn.disabled=false; btn.textContent='送出申請'; showResult(name, res); })
    .catch(function(x){ btn.disabled=false; btn.textContent='送出申請'; err.textContent = '送出失敗：'+x.message; });
  return false;
}

function showResult(name, res){
  var cls = {ok:'ok', dup:'warn', cert:'warn', no:'bad'};
  var icon = {ok:'✅', dup:'ℹ️', cert:'ℹ️', no:'❌'};
  var box = res.map(function(r){
    return '<div class="r '+(cls[r.status]||'warn')+'"><div class="n">'+(icon[r.status]||'')+' '+esc(r.course)+'</div>'+
      '<div class="msg">'+esc(r.status==='no' ? '無法申請：'+r.message+'。請確認姓名和課程有沒有選錯，修改後再送出一次。' : r.message)+'</div></div>';
  }).join('');
  var failed = res.filter(function(r){ return r.status==='no'; }).map(function(r){ return r.code; });
  if(!failed.length){
    document.getElementById('f').style.display='none';
    document.getElementById('result').innerHTML = '<div class="card"><label class="q">'+esc(name)+' 您好，申請結果如下</label>'+box+
      '<button class="again" onclick="picked=[];dayFilter=\'\';render();window.scrollTo(0,0)">再填一份</button></div>';
  } else {
    // 有失敗的：留在表單上，把成功的課拿掉，失敗的保留讓學員修改
    picked = picked.filter(function(c){ return failed.indexOf(c.code)>=0; });
    drawPicked();
    document.getElementById('result').innerHTML = '';
    var top = document.getElementById('topmsg');
    if(!top){ top = document.createElement('div'); top.id='topmsg'; top.className='card'; var f=document.getElementById('f'); f.parentNode.insertBefore(top, f); }
    top.innerHTML = '<label class="q">申請結果</label>'+box;
  }
  window.scrollTo(0,0);
}

init();
</script>
</body>
</html>
